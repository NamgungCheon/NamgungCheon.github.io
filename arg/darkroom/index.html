<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>지점</title>
    <style>
        body {
            text-align: center;  /* 让内部行内/内联块元素居中 */
            margin: 0;
            padding: 20px;
        }
        div {
            margin-bottom: 20px;
        }
        img {
            max-width: 50%;      /* 响应式，防止超出屏幕 */
            height: auto;
            display: inline-block; /* 配合 body text-align 居中 */
        }
    </style>
</head>
<body>
    <div>
        <img src="/arg/assets/location1.jpg" alt="窗台">
    </div>
    <div>
        <img src="/arg/assets/location2.jpg" alt="桌子">
    </div>
    <div>
        <img src="/arg/assets/location3.jpg" alt="椅子">
    </div>
    <div>
        <img src="/arg/assets/location4.jpg" alt="走廊">
    </div>
</body>
</html>
