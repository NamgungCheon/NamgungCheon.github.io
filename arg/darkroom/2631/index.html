<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>진실과 거짓</title>
    <style>
        body {
            text-align: center;
            font-family: monospace;
            margin: 2rem;
            background-color: rgb(255, 255, 255);
            color: #333; /* 改为深色，便于在白色背景阅读 */
        }
        img {
            max-width: 80%;
            border: 2px solid #555;
            margin: 1rem;
            cursor: pointer;
            transition: 0.2s;
            background-color: #000000;
        }
        img:hover {
            opacity: 0.9;
            border-color: #888;
        }
        .download {
            margin: 1rem;
        }
        .secret-corner {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            /* 移除透明度，让链接更明显 */
            opacity: 1;
        }
        .secret-corner a {
            color: #555; /* 深灰色，清晰可见 */
            text-decoration: none;
        }
        .secret-corner a:hover {
            color: #000; /* 悬停变黑 */
            text-decoration: underline;
        }
        a {
            color: #ccc;
            text-decoration: none;
        }
        p {
            color: #555;
        }
        h1 {
            color: #222;
        }
    </style>
</head>
<body>
    <h1>🎭 진실과 거짓</h1>
    <p>이 사진은 평범해 보이지만 중요한 정보를 숨기고 있습니다.</p>
    <div class="download">
        <a href="/arg/assets/phantom.tif" download="phantom.tif">
            <img src="/arg/assets/phantom.jpg" alt="거짓">
        </a>
    </div>
    <div class="secret-corner">
        <a href="/arg">🔒 홈페이지로 돌아가기</a>
    </div>
</body>
</html>
