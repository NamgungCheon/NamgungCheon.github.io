<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>진실과 거짓</title>
    <style>
        body {
            text-align: center;
            font-family: monospace;
            margin: 2rem;
            background-color: rgb(255, 255, 255);
            color: #e0e0e0;
        }
        img {
            max-width: 80%;
            border: 2px solid #555;
            margin: 1rem;
            cursor: pointer;
            transition: 0.2s;
            background-color: #000000;
        }
        img:hover {
            opacity: 0.9;
            border-color: #888;
        }
        。download {
            margin: 1rem;
        }
        。secret-corner {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            opacity: 0.5;
        }
        。secret-corner:hover {
            opacity: 1;
        }
        .secret-corner a {
            color: #505050;
            text-decoration: none;
        }
        .secret-corner a:hover {
            color: white;
        }
        a {
            color: #ccc;
            text-decoration: none;
        }
        p {
            color: #bbb;
        }
    </style>
</head>
<body>
    <h1>🎭 진실과 거짓</h1>
    <p>이 사진은 평범해 보이지만 중요한 정보를 숨기고 있습니다.</p>
    <div class="download">
        <a href="/NamgungCheon.github.io/arg/assets/phantom.tif" download="phantom.tif">
            <img src="/NamgungCheon.github.io/arg/assets/phantom.jpg" alt="거짓">
        </a>
    </div>
    <div class="secret-corner">
        <a href="/NamgungCheon.github.io/arg/index.html">🔒 홈페이지로 돌아가기</a>
    </div>
</body>
</html>
